name: google_contacts_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  sqflite: ^2.4.2
  path: ^1.9.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.6.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  uuid: ^4.5.3
  shimmer: ^3.0.0
  connectivity_plus: ^7.1.1
  flutter_slidable: ^4.0.3
  scrollable_positioned_list: ^0.3.8
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  country_phone_validator: ^1.0.2
  circle_flags: ^5.0.1
  country_picker: ^2.0.28


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  injectable_generator: ^3.0.2
  flutter_gen_runner: ^5.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/

flutter_gen:
  output: lib/gen/